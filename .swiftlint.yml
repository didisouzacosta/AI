# Shared baseline for SwiftLint 0.63.2; layout is owned by swift-format 6.3.0.
opt_in_rules:
  - force_try
  - force_unwrapping

disabled_rules:
  - opening_brace
  - trailing_comma

file_length:
  warning: 500
  error: 700
line_length:
  warning: 120
  error: 160
nesting:
  type_level: 2
type_body_length:
  warning: 350
  error: 500

custom_rules:
  required_class_mark:
    name: "Required class MARK"
    regex: '(?m)^[ \t]*(?:@[A-Za-z_][A-Za-z_0-9]*(?:\([^()\n]*\))?[ \t]*(?:\n[ \t]*)?)*(?:(?:public|private|fileprivate|internal|open|final|abstract|indirect|package|nonisolated)[ \t]+)*class[ \t]+[A-Za-z_][A-Za-z_0-9]*(?:<[^>\n]+>)?[^{}]*(?:\{[ \t]*\n(?![ \t]*// MARK: - [^\n]+(?:\n|$))|\{[^\n}]*\})'
    message: "Every class must begin with a responsibility MARK section."
    severity: error
