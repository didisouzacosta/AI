name: AI base checks

on:
  pull_request:
  push:

jobs:
  consumer-setup:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          export DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version | grep -Fx 'Xcode 26.6'
      - name: Install SwiftLint 0.63.2
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/realm/SwiftLint/releases/download/0.63.2/portable_swiftlint.zip \
            --output "$RUNNER_TEMP/swiftlint.zip"
          mkdir "$RUNNER_TEMP/swiftlint"
          unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          chmod +x "$RUNNER_TEMP/swiftlint/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/swiftlint/swiftlint" version | grep -Fx '0.63.2'
      - name: Install SwiftFormat 0.63.0
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/nicklockwood/SwiftFormat/releases/download/0.63.0/swiftformat.zip \
            --output "$RUNNER_TEMP/swiftformat.zip"
          mkdir "$RUNNER_TEMP/swiftformat"
          unzip -q "$RUNNER_TEMP/swiftformat.zip" -d "$RUNNER_TEMP/swiftformat"
          chmod +x "$RUNNER_TEMP/swiftformat/swiftformat"
          echo "$RUNNER_TEMP/swiftformat" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/swiftformat/swiftformat" --version | grep -Fx '0.63.0'
      - name: Test consumer setup, lint gate, MARK and spacing fixtures
        run: |
          bash -n scripts/*.sh tests/*.sh
          perl -c scripts/fix-swift-spacing.pl
          scripts/test-required-type-marks.sh
          scripts/test-swift-spacing.sh
          bash tests/consumer-setup-tests.sh
