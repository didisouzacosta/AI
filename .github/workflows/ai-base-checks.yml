name: AI base checks

on:
  pull_request:
  push:

jobs:
  consumer-setup:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          export DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version | grep -Fx 'Xcode 26.6'
      - name: Install pinned SwiftLint and SwiftFormat
        run: |
          scripts/install-swift-tools.sh
          echo "$GITHUB_WORKSPACE/.build/quality-tools/bin" >> "$GITHUB_PATH"
      - name: Test consumer setup, lint gate, MARK and spacing fixtures
        run: |
          bash -n scripts/*.sh tests/*.sh
          perl -c scripts/fix-swift-spacing.pl
          python3 -m py_compile scripts/add-type-marks.py
          scripts/test-required-type-marks.sh
          scripts/test-swift-spacing.sh
          bash tests/consumer-setup-tests.sh
